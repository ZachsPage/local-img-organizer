# Example configuration

# Names or wildcards under --input-dir that extractors skip - matched against the file name and
# every dir name below --input-dir, so a dir name skips everything under it
exclusions:
  - "Screenshots"
  - "IMG_*_edited.jpg"

extractors:
  classification:
    threshold: 0.999 # very sure
    categories:
      # Define your buckets for the model to match with (or return None)
      # - More descriptive phrases often work better than single words
      - "a recipe or cooking instructions":
        - op: move
          subdir_name: recipes
      - "a receipt, bill, or document":
        - op: move
          subdir_name: documents
      - "a vehicle":
        - op: tag
          name: type
          value: vehicle
      - "a pet":
        - op: tag
          name: type
          value: pet
  metadata:
    # Extracts date_taken / file_modified / gps / location - with no operations set up every
    # readable image runs `noop`, so the metadata still shows up in the journal
    lookup_location: true # turn any gps found into a city / state / country
    operations:
      - op: rename
      # Backfill the "date taken" tags from the file's modified time, but only for images with no
      # capture time of their own - needs `exiftool` on PATH
      - op: tag
        date: true